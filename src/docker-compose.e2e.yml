# ============================================================
# Anichron — end-to-end runs (src/Anichron.UI/e2e)
#
# The API image built from this checkout, and PostgreSQL on
# tmpfs so every run starts from an empty database. No Worker
# runs until a flow needs media. Caddy serves it over HTTPS
# on https://localhost:8443 with its own internal certificate.
#
#   docker build -f src/Anichron.API/Dockerfile -t anichron-api:e2e src
#   docker compose -f src/docker-compose.e2e.yml up --detach --wait
#   pnpm --dir src/Anichron.UI e2e
#   docker compose -f src/docker-compose.e2e.yml down
# ============================================================

services:
  anichron-db:
    extends:
      file: docker-compose.yml
      service: anichron-db
    container_name: !reset null
    restart: !reset null
    environment:
      - POSTGRES_USER=anichron_e2e
      - POSTGRES_PASSWORD=anichron_e2e
    volumes: !reset []
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anichron_e2e -d anichron"]
      interval: 2s
      retries: 30

  anichron-api:
    extends:
      file: docker-compose.yml
      service: anichron-api
    image: ${E2E_API_IMAGE:-anichron-api:e2e}
    container_name: !reset null
    restart: !reset null
    ports: !reset []
    environment: !override
      - ASPNETCORE_ENVIRONMENT=Production
      - POSTGRES_CONNECTION__HOST=anichron-db
      - POSTGRES_CONNECTION__DBNAME=anichron
      - POSTGRES_CONNECTION__PORT=5432
      - POSTGRES_CONNECTION__USER=anichron_e2e
      - POSTGRES_CONNECTION__PASSWORD=anichron_e2e
      - Jwt__Secret=end-to-end-only-secret-at-least-32-bytes-long
      - Jwt__Issuer=anichron
      - Jwt__Audience=anichron
      - BOOTSTRAP_ADMIN_PASSWORD=end-to-end bootstrap passphrase
      - RateLimit__SensitivePermitLimit=10000
      - RateLimit__RefreshPermitLimit=10000
    volumes: !reset []
    healthcheck:
      interval: 2s
      retries: 30
      start_period: !reset null

  anichron-tls:
    image: caddy:2.10-alpine
    command: caddy reverse-proxy --from https://localhost:8443 --to anichron-api:8080 --internal-certs --disable-redirects
    ports:
      - "${E2E_PORT:-8443}:8443"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://localhost:8443/api/v1/healthz || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 30
    depends_on:
      anichron-api:
        condition: service_healthy
