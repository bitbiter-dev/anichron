# ============================================================
# Anichron — end-to-end runs (src/Anichron.UI/e2e)
#
# The API and Worker images built from this checkout, and
# PostgreSQL on tmpfs so every run starts from an empty
# database. One Worker serves every user; it ingests the made-up
# library in Anichron.UI/e2e/media/mira, mounted read-only at
# the same path in the API and the Worker, once global setup
# adds its storage config. anichron-migrate migrates and
# creates the bootstrap admin before the API starts; `--wait`
# accepts it exiting 0, as it does anichron-next-build. Caddy
# serves it over HTTPS on https://localhost:8443 with its own
# internal certificate, and a next build's sw.js to a browser
# with the cookie anichron-e2e-build=next (e2e/update.spec.ts).
#
#   docker build -f src/Anichron.API/Dockerfile -t anichron-api:e2e src
#   docker build -f src/Anichron.Worker/Dockerfile -t anichron-worker:e2e \
#     --secret id=sixlabors_license,src=sixlabors.lic src
#   docker compose -f src/docker-compose.e2e.yml up --detach --wait
#   pnpm --dir src/Anichron.UI e2e
#   docker compose -f src/docker-compose.e2e.yml down
# ============================================================

name: anichron-e2e

services:
  anichron-db:
    extends:
      file: docker-compose.yml
      service: anichron-db
    container_name: !reset null
    restart: !reset null
    environment:
      - POSTGRES_USER=anichron_e2e
      - POSTGRES_PASSWORD=anichron_e2e
    volumes: !reset []
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anichron_e2e -d anichron"]
      interval: 2s
      retries: 30

  anichron-migrate:
    extends:
      file: docker-compose.yml
      service: anichron-migrate
    image: ${E2E_API_IMAGE:-anichron-api:e2e}
    container_name: !reset null
    environment: !override
      - POSTGRES_CONNECTION__HOST=anichron-db
      - POSTGRES_CONNECTION__DBNAME=anichron
      - POSTGRES_CONNECTION__PORT=5432
      - POSTGRES_CONNECTION__USER=anichron_e2e
      - POSTGRES_CONNECTION__PASSWORD=anichron_e2e
      - BOOTSTRAP_ADMIN_PASSWORD=end-to-end bootstrap passphrase

  anichron-api:
    extends:
      file: docker-compose.yml
      service: anichron-api
    image: ${E2E_API_IMAGE:-anichron-api:e2e}
    container_name: !reset null
    restart: !reset null
    ports: !reset []
    environment: !override
      - ASPNETCORE_ENVIRONMENT=Production
      - POSTGRES_CONNECTION__HOST=anichron-db
      - POSTGRES_CONNECTION__DBNAME=anichron
      - POSTGRES_CONNECTION__PORT=5432
      - POSTGRES_CONNECTION__USER=anichron_e2e
      - POSTGRES_CONNECTION__PASSWORD=anichron_e2e
      - Jwt__Secret=end-to-end-only-secret-at-least-32-bytes-long
      - Jwt__Issuer=anichron
      - Jwt__Audience=anichron
      - RateLimit__SensitivePermitLimit=10000
      - RateLimit__RefreshPermitLimit=10000
    volumes: !override
      - ./Anichron.UI/e2e/media/mira:/data/originals/mira:ro
      - proxies:/data/proxies:ro
    healthcheck:
      interval: 2s
      retries: 30
      start_period: !reset null

  anichron-worker:
    extends:
      file: docker-compose.yml
      service: anichron-worker
    image: ${E2E_WORKER_IMAGE:-anichron-worker:e2e}
    container_name: !reset null
    restart: !reset null
    devices: !reset []
    environment: !override
      - POSTGRES_CONNECTION__HOST=anichron-db
      - POSTGRES_CONNECTION__DBNAME=anichron
      - POSTGRES_CONNECTION__PORT=5432
      - POSTGRES_CONNECTION__USER=anichron_e2e
      - POSTGRES_CONNECTION__PASSWORD=anichron_e2e
      - Worker__WorkPollIntervalSeconds=1
    volumes: !override
      - ./Anichron.UI/e2e/media/mira:/data/originals/mira:ro
      - proxies:/data/proxies:rw

  anichron-next-build:
    image: ${E2E_API_IMAGE:-anichron-api:e2e}
    user: root
    entrypoint: ["sh", "-c", "cp /app/wwwroot/sw.js /next/sw.js && echo '// next build' >> /next/sw.js"]
    volumes:
      - next-build:/next

  anichron-tls:
    image: caddy:2.10-alpine
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - next-build:/srv/next:ro
    ports:
      - "${E2E_PORT:-8443}:8443"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://localhost:8443/api/v1/healthz || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 30
    depends_on:
      anichron-api:
        condition: service_healthy
      anichron-next-build:
        condition: service_completed_successfully

configs:
  caddyfile:
    content: |
      {
        auto_https disable_redirects
      }
      https://localhost:8443 {
        tls internal
        @next {
          path /sw.js
          header Cookie *anichron-e2e-build=next*
        }
        handle @next {
          root * /srv/next
          header Cache-Control no-cache
          file_server
        }
        handle {
          reverse_proxy anichron-api:8080
        }
      }

volumes:
  next-build:
  proxies:
