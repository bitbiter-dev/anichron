# ============================================================
# Anichron — Docker Compose
#
# Copy .env.example to .env and fill in your values before
# running: docker-compose up -d
#
# Originals: every user's NAS folder is mounted read-only at
# /data/originals/<user>, at the SAME container path in the API
# and in the worker(s) that process that user. Only the host
# side (left of the colon) depends on your NAS layout, e.g.
# Synology: /volume1/homes/<user>/Photos:/data/originals/<user>:ro
#
# Multi-user setup, either:
# - one worker per user: duplicate the anichron-worker block,
#   give each copy a unique container_name, WORKER__USER,
#   WORKER__ROOTPATH and mount; or
# - one worker for all: drop WORKER__USER and WORKER__ROOTPATH,
#   mount every user's folder, and add each user's storage
#   config (e.g. /data/originals/alice) through the admin API.
# Add one API mount line per user either way.
# ============================================================

services:
  anichron-db:
    image: postgres:17-alpine
    container_name: anichron-db
    restart: always
    environment:
      POSTGRES_USER: anichron_admin
      POSTGRES_PASSWORD: ${DB_PW}
      POSTGRES_DB: anichron
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anichron_admin -d anichron"]
      interval: 10s
      timeout: 5s
      retries: 5

  anichron-api:
    image: ${DOCKERHUB_USERNAME}/anichron-api:latest
    container_name: anichron-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - POSTGRES_CONNECTION__HOST=anichron-db
      - POSTGRES_CONNECTION__DBNAME=anichron
      - POSTGRES_CONNECTION__PORT=5432
      - POSTGRES_CONNECTION__USER=anichron_admin
      - POSTGRES_CONNECTION__PASSWORD=${DB_PW}
      - Jwt__Secret=${JWT_SECRET}
      - Jwt__Issuer=anichron
      - Jwt__Audience=anichron
      # Uncomment and set to your UI's origin(s) if not using a reverse proxy (comma-separated):
      # - CORS__ALLOWEDORIGINS=http://localhost:3000
      # Behind a reverse proxy: trust its address so X-Forwarded-For is honoured (comma-separated):
      # - FORWARDEDHEADERS__KNOWNPROXIES=172.18.0.10
      # - FORWARDEDHEADERS__KNOWNNETWORKS=172.18.0.0/16
    volumes:
      # One line per user, same container path as that user's worker:
      - /path/to/alice/photos:/data/originals/alice:ro
      - ${BASE_PATH}/anichron/proxy_cache:/data/proxies:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      anichron-db:
        condition: service_healthy

  # One worker per user.
  # - Set WORKER__USER to the email or username of the user.
  # - Mount only that user's NAS folder, at /data/originals/<user>, and
  #   set WORKER__ROOTPATH to the same container path.
  # - Remove the `devices` block if you have no Intel GPU.
  # - For several NAS folders for one user, mount each below the user's
  #   folder (the root then covers all of them):
  #     - /nas/photos:/data/originals/alice/photos:ro
  #     - /nas/videos:/data/originals/alice/videos:ro
  anichron-worker:
    image: ${DOCKERHUB_USERNAME}/anichron-worker:latest
    container_name: anichron-worker
    restart: unless-stopped
    devices:
      - /dev/dri:/dev/dri  # Intel QuickSync passthrough — remove if no Intel GPU
    environment:
      - POSTGRES_CONNECTION__HOST=anichron-db
      - POSTGRES_CONNECTION__DBNAME=anichron
      - POSTGRES_CONNECTION__PORT=5432
      - POSTGRES_CONNECTION__USER=anichron_admin
      - POSTGRES_CONNECTION__PASSWORD=${DB_PW}
      - WORKER__USER=${WORKER_USER}  # Email or username of the user this worker processes
      - WORKER__ROOTPATH=/data/originals/alice  # Container path, must match the mount below
      # Optional overrides (defaults shown):
      # - WORKER__CRAWLINTERVALHOURS=4
      # - WORKER__MAXCONCURRENTFILES=4
    volumes:
      - /path/to/alice/photos:/data/originals/alice:ro  # ← this user's NAS folder only
      - ${BASE_PATH}/anichron/proxy_cache:/data/proxies:rw
    depends_on:
      anichron-db:
        condition: service_healthy

volumes:
  postgres_data:
