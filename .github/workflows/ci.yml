name: CI

on:
  push:
    branches: [master]
    tags: ['v*.*.*']
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      push_to_registry:
        description: Push images to Docker Hub
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.pull_request.draft == true && 'draft' || 'ready' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Areas changed (scripts/changed-areas.sh) and a tested master tree
  # (scripts/tested-on-pr.sh); the gate allows the skips they imply.
  changes:
    name: Changes
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      backend: ${{ steps.areas.outputs.backend }}
      tested: ${{ steps.tested.outputs.tested }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # On a pull request HEAD is the merge commit, whose first parent is the
      # base branch: the diff is exactly what merging would change.
      - name: Detect changed areas
        id: areas
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -o pipefail
          if [ "$EVENT" = pull_request ]; then
            git -c core.quotepath=false diff --name-only --no-renames HEAD^1 HEAD
          fi | scripts/changed-areas.sh "$EVENT" | tee -a "$GITHUB_OUTPUT"

      - name: Tree tested on its pull request
        id: tested
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/tested-on-pr.sh "$GITHUB_SHA" | tee -a "$GITHUB_OUTPUT"

  checks:
    name: Checks
    needs: changes
    if: needs.changes.outputs.backend == 'true' && needs.changes.outputs.tested != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/lfs

      - name: dotnet-ef matches EF Core
        run: scripts/tool-versions.sh

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build src/

      - name: Test
        run: dotnet test src/ --no-build -p:TestSuite=Unit --collect:"XPlat Code Coverage" --results-directory coverage --settings src/coverlet.runsettings

      - name: Generate coverage report
        uses: danielpalme/ReportGenerator-GitHub-Action@v5
        with:
          reports: 'coverage/**/coverage.cobertura.xml'
          targetdir: 'coverage/report'
          reporttypes: 'HtmlInline;MarkdownSummaryGithub;Badges'
          verbosity: 'Warning'

      - name: Publish coverage summary
        if: always()
        run: cat coverage/report/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/report/
          retention-days: 30

      - name: Check formatting
        run: dotnet format --verify-no-changes src/

      # ⛔ Before the helper-script tests, not after. derive-db-docs.sh shells out to
      # `dotnet ef`, which is a MANIFEST tool — without the restore it does not exist on a
      # clean runner, and the script fails with "dotnet-ef does not exist" rather than with
      # anything about the schema. It happens to be installed globally on some dev machines,
      # which is exactly how that dependency went unnoticed until CI.
      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Test helper scripts
        run: |
          scripts/mutation-report.test.sh
          scripts/publish-badges.test.sh
          scripts/assemble-pages.test.sh
          scripts/derive-db-docs.test.sh
          scripts/derive-openapi.test.sh
          scripts/ci-gate.test.sh
          scripts/ci-gate-guard.test.sh
          scripts/changed-areas.test.sh
          scripts/mutation-changed.test.sh
          scripts/mutation-targets.test.sh
          scripts/issue-readiness.test.sh
          scripts/arch-review-due.test.sh
          scripts/mutation-guard.test.sh
          scripts/stryker-sweep.test.sh
          scripts/graph.test.sh
          scripts/graph-hint.test.sh
          scripts/tool-versions.test.sh
          scripts/lfs-pointers.test.sh
          scripts/docs-guard.test.sh
          scripts/with-lock.test.sh
          scripts/land.test.sh
          scripts/tested-on-pr.test.sh
          scripts/full-run-report.test.sh

      - name: Mutation setup matches its rules
        run: scripts/mutation-guard.sh

      - name: Gate skips match the backend jobs
        run: scripts/ci-gate-guard.sh

      # Regenerates docs/schema.sql and fails if anything moved. No database is needed —
      # `dotnet ef dbcontext script` works off the model — so this stays in this job rather
      # than the database-docs job below. It runs with --no-build, so it must follow Build.
      # See docs/adr/0004-schema-documentation.md.
      - name: Schema documentation is current
        run: scripts/derive-db-docs.sh --check

      - name: OpenAPI document is current
        run: scripts/derive-openapi.sh --check

  # Reads only the index, so its checkout has no LFS objects.
  lfs:
    name: LFS pointers
    needs: changes
    if: needs.changes.outputs.tested != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Every binary is an LFS pointer
        run: scripts/lfs-pointers.sh

  docs:
    name: Docs
    needs: changes
    if: needs.changes.outputs.tested != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Docs are outlines
        run: scripts/docs-guard.sh

  integration:
    name: Integration tests
    needs: changes
    if: needs.changes.outputs.backend == 'true' && needs.changes.outputs.tested != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/lfs

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Integration tests
        run: dotnet test src/ -p:TestSuite=Integration

  ui:
    name: UI
    needs: changes
    if: needs.changes.outputs.tested != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: src/Anichron.UI
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Installs pnpm from packageManager and Node from .nvmrc, then runs a frozen install.
      - uses: pnpm/setup@v3
        with:
          working-directory: src/Anichron.UI
          require-lockfile: true
          cache: true

      - name: Generated API types are current
        run: pnpm openapi:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format

      - name: Dependency rules
        run: pnpm depcruise

      - name: Unit tests
        run: pnpm test

      - name: Test UI helper scripts
        working-directory: .
        run: |
          scripts/ui-mutation-changed.test.sh
          scripts/ui-mutation-guard.test.sh

      - name: Mutation setup matches its rules
        working-directory: .
        run: scripts/ui-mutation-guard.sh

      # A pull request runs incrementally on master's baseline; master runs
      # every mutant and publishes the next baseline.
      - name: Mutation test
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            scripts/ui-mutation-changed.sh --base "origin/$BASE"
          else
            scripts/ui-mutation-changed.sh --all
          fi

      - name: Publish the incremental baseline
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: ui-mutation-incremental
          path: src/Anichron.UI/reports/stryker-incremental.json
          if-no-files-found: error
          retention-days: 30

      - name: Build
        run: pnpm build

      - name: Bundle budget
        run: pnpm size

  # The API image built from this PR, started with PostgreSQL and no Worker,
  # in WebKit, Chromium and Firefox (src/Anichron.UI/e2e).
  e2e:
    name: E2E
    needs: changes
    if: needs.changes.outputs.tested != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      E2E_API_IMAGE: anichron-api:e2e
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/lfs

      - uses: docker/setup-buildx-action@v4

      - name: Build the API image
        uses: docker/build-push-action@v7
        with:
          context: src
          file: src/Anichron.API/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.E2E_API_IMAGE }}
          cache-from: type=registry,ref=${{ vars.DOCKERHUB_USERNAME }}/anichron-api:edge
          provenance: false

      - name: Start the API and PostgreSQL
        run: docker compose -f src/docker-compose.e2e.yml up --detach --wait

      - uses: pnpm/setup@v3
        with:
          working-directory: src/Anichron.UI
          require-lockfile: true
          cache: true

      - name: Install browsers
        working-directory: src/Anichron.UI
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: End-to-end tests
        working-directory: src/Anichron.UI
        run: pnpm e2e

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: src/Anichron.UI/test-results/look-*/login-*.png
          retention-days: 14

      - name: API logs
        if: failure()
        run: docker compose -f src/docker-compose.e2e.yml logs

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            src/Anichron.UI/playwright-report/
            src/Anichron.UI/test-results/
          retention-days: 7

  # One Stryker run per project, in parallel (ADR 0010): in solution mode
  # Stryker captures the same coverage once per project. A pull request mutates
  # the files it changed, unless a change is one a scoped run cannot see; then,
  # and on master, every target project from the IsMutationTarget convention
  # runs, so a new project is mutated without editing this file (#306).
  mutation-targets:
    name: Mutation targets
    needs: changes
    if: needs.changes.outputs.backend == 'true' && needs.changes.outputs.tested != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      projects: ${{ steps.list.outputs.projects }}
      scope: ${{ steps.list.outputs.scope }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Plan the mutation runs
        id: list
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          set -o pipefail
          if [ "$EVENT" = pull_request ]; then
            plan=$(scripts/mutation-changed.sh --base "origin/$BASE" --matrix)
          else
            plan=$(scripts/mutation-changed.sh --matrix --all)
          fi
          projects=$(jq -c '.projects' <<<"$plan")
          if [ "$(jq -r '.scope' <<<"$plan")" = full ] && [ "$(jq length <<<"$projects")" -eq 0 ]; then
            echo "::error::scripts/mutation-targets.sh listed no projects; nothing would be mutated"
            exit 1
          fi
          echo "projects=$projects" >> "$GITHUB_OUTPUT"
          echo "scope=$(jq -r '.scope' <<<"$plan")" >> "$GITHUB_OUTPUT"
          jq -r '"### Mutation scope: \(.scope)", (.projects[] | "- \(.name)")' <<<"$plan" | tee -a "$GITHUB_STEP_SUMMARY"

  mutation-project:
    name: Mutation — ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: mutation-targets
    if: needs.mutation-targets.outputs.projects != '[]'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.mutation-targets.outputs.projects) }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/lfs

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore .NET tools
        run: dotnet tool restore

      # The gate is the thresholds in stryker-config.json, all 100. The job
      # fails below them; the Mutation job still merges every report it got.
      - name: Mutation test
        timeout-minutes: 20
        env:
          ARGS: ${{ toJSON(matrix.args) }}
        run: |
          mapfile -t args < <(jq -r '.[]' <<<"$ARGS")
          scripts/stryker-sweep.sh "${args[@]}" --output ../mutation

      - name: Publish mutation summary
        if: always()
        env:
          NAME: ${{ matrix.name }}
        run: |
          if [ -f mutation/reports/mutation-report.md ]; then
            cat mutation/reports/mutation-report.md >> $GITHUB_STEP_SUMMARY
          else
            echo "### Mutation testing of $NAME produced no report — see the step log" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload project report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-part-${{ matrix.name }}
          path: mutation/reports/mutation-report.json
          if-no-files-found: ignore
          retention-days: 1

  mutation:
    name: Mutation
    runs-on: ubuntu-latest
    needs: [changes, mutation-targets, mutation-project]
    if: ${{ !cancelled() && needs.changes.outputs.backend == 'true' && needs.changes.outputs.tested != 'true' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: mutation-part-*
          path: parts

      # Refuses unless every planned project left a report, and on any
      # inconsistency between them (scripts/mutation-report.sh, "merge").
      - name: Merge project reports
        id: merge
        continue-on-error: true
        env:
          PROJECTS: ${{ needs.mutation-targets.outputs.projects }}
        run: |
          if [ -z "$PROJECTS" ]; then
            echo "::error::No mutation target list to merge against"
            exit 1
          fi
          if [ "$PROJECTS" = '[]' ]; then
            echo '### Mutation: no changed backend file to mutate' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          missing=$(jq -r '.[].name' <<<"$PROJECTS" | while IFS= read -r name; do
            [ -f "parts/mutation-part-$name/mutation-report.json" ] || echo "$name"
          done)
          if [ -n "$missing" ]; then
            echo "::error::No mutation report from: $(echo $missing)"
            exit 1
          fi
          mkdir -p mutation/reports
          scripts/mutation-report.sh merge parts/*/mutation-report.json > mutation/reports/mutation-report.json.tmp
          mv mutation/reports/mutation-report.json.tmp mutation/reports/mutation-report.json
          cp scripts/mutation-viewer.html mutation/reports/mutation-report.html

      - name: Publish merged score
        if: steps.merge.outcome == 'success' && needs.mutation-targets.outputs.projects != '[]'
        env:
          SCOPE: ${{ needs.mutation-targets.outputs.scope }}
        run: |
          if tally=$(scripts/mutation-report.sh tally mutation/reports/mutation-report.json 2>"$RUNNER_TEMP/tally.err"); then
            jq -r '"### Mutation score, all projects: \(.score)% (\(.detected) of \(.total) detected)"' <<<"$tally" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$SCOPE" = changed ] && grep -q '^no detectable mutants' "$RUNNER_TEMP/tally.err"; then
            echo '### Mutation: the changed files hold no mutants' >> "$GITHUB_STEP_SUMMARY"
          else
            cat "$RUNNER_TEMP/tally.err" >&2
            exit 1
          fi

      - name: Upload mutation report
        if: steps.merge.outcome == 'success' && needs.mutation-targets.outputs.projects != '[]'
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: mutation/reports/
          retention-days: 30

      - name: Enforce mutation score
        if: always()
        env:
          TARGETS: ${{ needs.mutation-targets.result }}
          PLANNED: ${{ needs.mutation-targets.outputs.projects }}
          PROJECTS: ${{ needs.mutation-project.result }}
          MERGE: ${{ steps.merge.outcome }}
        run: |
          if [ "$PROJECTS" = skipped ] && [ "$PLANNED" = '[]' ]; then
            PROJECTS=success
          fi
          if [ "$TARGETS" != success ] || [ "$PROJECTS" != success ] || [ "$MERGE" != success ]; then
            echo "::error::Mutation testing failed (targets: $TARGETS, projects: $PROJECTS, merge: $MERGE). See each project job's summary for its score, and the mutation-report artifact for surviving mutants."
            exit 1
          fi

  # The API image carries the UI, so it builds on every pull request; it waits
  # for Checks, which a UI-only pull request skips.
  docker-api:
    name: Docker — API
    runs-on: ubuntu-latest
    needs: [changes, checks]
    if: >-
      ${{ !cancelled() && needs.changes.result == 'success'
      && (needs.checks.result == 'success' || needs.checks.result == 'skipped')
      && (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && !inputs.push_to_registry)) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/lfs

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Build API
        uses: docker/build-push-action@v7
        with:
          context: src
          file: src/Anichron.API/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=registry,ref=${{ vars.DOCKERHUB_USERNAME }}/anichron-api:edge
          provenance: false
          secrets: |
            sixlabors_license=${{ secrets.SIXLABORS_LICENSE_KEY }}

  docker-worker:
    name: Docker — Worker
    runs-on: ubuntu-latest
    needs: [changes, checks]
    if: >-
      ${{ needs.changes.outputs.backend == 'true'
      && (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && !inputs.push_to_registry)) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/lfs

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Build Worker
        uses: docker/build-push-action@v7
        with:
          context: src
          file: src/Anichron.Worker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=registry,ref=${{ vars.DOCKERHUB_USERNAME }}/anichron-worker:edge
          provenance: false
          secrets: |
            sixlabors_license=${{ secrets.SIXLABORS_LICENSE_KEY }}

  gate:
    name: ${{ github.event.pull_request.draft == true && 'Draft, no CI' || 'CI gate' }}
    runs-on: ubuntu-latest
    needs: [changes, checks, lfs, docs, integration, mutation, ui, e2e, docker-api, docker-worker]
    if: always()
    permissions:
      contents: read
    steps:
      - name: A draft
        if: github.event.pull_request.draft == true
        run: echo '::notice::A draft runs no CI. Mark it ready for review, or run scripts/land.sh.'

      - uses: actions/checkout@v7
        if: github.event.pull_request.draft != true

      - name: Every required job succeeded
        if: github.event.pull_request.draft != true
        env:
          EVENT: ${{ github.event_name }}
          NEEDS: ${{ toJSON(needs) }}
        run: >-
          scripts/ci-gate.sh "$EVENT" "$NEEDS"
          --backend checks --backend integration --backend mutation --backend docker-worker
          docker-api docker-worker

  docker-publish:
    name: Publish image — ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: gate
    if: >-
      ${{ !cancelled() && needs.gate.result == 'success'
      && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') || inputs.push_to_registry == true) }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: API
            repo: anichron-api
            dockerfile: src/Anichron.API/Dockerfile
          - name: Worker
            repo: anichron-worker
            dockerfile: src/Anichron.Worker/Dockerfile

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/lfs

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.repo }}
          flavor: |
            latest=false
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=edge,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v7
        with:
          context: src
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.repo }}:edge
          cache-to: type=inline
          provenance: false
          secrets: |
            sixlabors_license=${{ secrets.SIXLABORS_LICENSE_KEY }}

  report:
    name: Report a failed master run
    runs-on: ubuntu-latest
    needs: [gate, docker-publish]
    if: ${{ failure() && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          OWNER: ${{ github.repository_owner }}
        run: scripts/full-run-report.sh 'CI on master' "$RUN_ID" "$OWNER"

  # The browsable half of the schema documentation: an ER diagram and per-table pages,
  # generated by tbls against a throwaway database.
  #
  # ⭐ The output is an ARTEFACT, never a committed file. A committed human-readable copy is
  # exactly what drifted before (see docs/adr/0004-schema-documentation.md); an artefact cannot
  # go stale because it is rebuilt from the migrations on every run.
  #
  # ⛔ Separate from checks because it needs a live PostgreSQL. The committed docs/schema.sql
  # needs none, so its drift gate stays in the checks job and keeps working on runners that
  # hold no Docker daemon.
  #
  # ⚠️ Deliberately NOT a required check. It documents; it does not gate. `continue-on-error`
  # keeps a tbls or container hiccup from blocking a merge on a schema that is otherwise fine.
  database-docs:
    name: Schema diagram
    needs: changes
    if: needs.changes.outputs.tested != 'true'
    runs-on: ubuntu-latest
    continue-on-error: true

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: anichron
          POSTGRES_PASSWORD: anichron
          POSTGRES_DB: anichron_docs
        ports:
          - 5432:5432
        # Without a health check the migration step races the server's first startup and fails
        # with a connection error that reads like a broken connection string.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Apply migrations to a throwaway database
        # ⭐ Migrations rather than a hand-written schema: this also proves the migrations
        # actually APPLY, which building the model alone never checks.
        #
        # ⚠️ No POSTGRES_CONNECTION__* here on purpose. AnichronDbContextFactory hardcodes its
        # connection string and never reads IConfiguration, so those variables would be read by
        # nobody — present only to mislead the next person debugging this job.
        run: |
          # Two prerequisites this job does NOT inherit from the checks job, each of which
          # failed it in turn before being added. It is a separate job on a clean checkout:
          #   1. dotnet-ef is a MANIFEST tool — `--global` is ignored inside a repo carrying
          #      .config/dotnet-tools.json, and `dotnet ef` then demands a restore.
          #   2. Nothing has restored the SOLUTION, so `dotnet ef` fails with NETSDK1004
          #      ("Assets file project.assets.json not found") before it reaches the database.
          dotnet tool restore
          dotnet restore src/

          # ⭐ `--connection` DOES override the design-time factory's hardcoded string — verified
          # by pointing it at a nonexistent host and confirming the error named that host rather
          # than the factory's `anichron_design`. Worth recording, because the factory ignoring
          # its `args` parameter makes the opposite look true from a reading of the code alone.
          dotnet ef database update --project src/Anichron.Core \
            --connection "Host=localhost;Database=anichron_docs;Username=anichron;Password=anichron"

      - name: Generate the schema documentation
        run: |
          curl -sSL -o tbls.tar.gz \
            https://github.com/k1LoW/tbls/releases/download/v1.96.0/tbls_v1.96.0_linux_amd64.tar.gz
          tar -xzf tbls.tar.gz tbls

          # ⭐ -t mermaid, not the default svg. Mermaid is rendered by the viewer rather than by
          # an image toolchain, so the diagram has no renderer dependency and stays readable in
          # the artefact without downloading anything. The table/column COMMENTs configured via
          # .HasComment(...) come through as descriptions — which is the whole point of putting
          # the rationale in the schema.
          ./tbls doc --rm-dist -t mermaid \
            "postgres://anichron:anichron@localhost:5432/anichron_docs?sslmode=disable" \
            schema-docs

      - name: Upload the schema documentation
        uses: actions/upload-artifact@v7
        with:
          name: schema-docs
          path: schema-docs/
          retention-days: 30
