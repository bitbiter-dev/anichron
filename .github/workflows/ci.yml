name: CI

on:
  push:
    branches: [master]
    tags: ['v*.*.*']
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      push_to_registry:
        description: Push images to Docker Hub
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      pages-artifact: ${{ steps.pages-upload.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build src/

      - name: Test
        run: dotnet test src/ --no-build --collect:"XPlat Code Coverage" --results-directory coverage --settings src/coverlet.runsettings

      - name: Generate coverage report
        uses: danielpalme/ReportGenerator-GitHub-Action@v5
        with:
          reports: 'coverage/**/coverage.cobertura.xml'
          targetdir: 'coverage/report'
          reporttypes: 'HtmlInline;MarkdownSummaryGithub;Badges'
          verbosity: 'Warning'

      - name: Publish coverage summary
        if: always()
        run: cat coverage/report/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

      - name: Check formatting
        run: dotnet format --verify-no-changes src/

      # ⛔ Before the helper-script tests, not after. derive-db-docs.sh shells out to
      # `dotnet ef`, which is a MANIFEST tool — without the restore it does not exist on a
      # clean runner, and the script fails with "dotnet-ef does not exist" rather than with
      # anything about the schema. It happens to be installed globally on some dev machines,
      # which is exactly how that dependency went unnoticed until CI.
      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Test helper scripts
        run: |
          scripts/mutation-report.test.sh
          scripts/publish-badges.test.sh
          scripts/assemble-pages.test.sh
          scripts/mutation-ratchet.test.sh
          scripts/derive-db-docs.test.sh

      # Regenerates docs/schema.sql and fails if anything moved. No database is needed —
      # `dotnet ef dbcontext script` works off the model — so this stays in the build job
      # rather than the database-docs job below. See docs/adr/0004-schema-documentation.md.
      - name: Schema documentation is current
        run: scripts/derive-db-docs.sh --check

      # Reads the ratchet's stored high-water mark from the badges branch and
      # turns it into Stryker flags. See docs/mutation-testing.md, "The ratchet".
      #
      # `git show FETCH_HEAD:...` rather than a checkout: the work tree has to
      # stay on the source branch, because scripts/ does not exist on badges.
      #
      # A missing branch, or a branch without the file, is the ordinary state
      # before the first advance — and the state left behind when someone
      # deletes the mark to reset the ratchet by hand. Neither may fail the
      # build, which is why both are folded into "no mark" rather than checked
      # apart. With no mark the script emits no flags and the committed
      # stryker-config.json governs, satisfying the fallback criterion.
      - name: Resolve the mutation gate
        id: gate
        run: |
          mark="$RUNNER_TEMP/highwater.json"

          # Mirrors publish-badges.sh: `ls-remote --exit-code` tells "no such
          # branch" (2) apart from "cannot reach origin" (anything else).
          # Folding those together is what would make a network blip look like
          # a fresh ratchet — and a fresh ratchet seeds from the committed
          # floor, which the advance step would then publish OVER the real
          # stored mark. An unreachable origin must stop the run, not guess.
          set +e
          git ls-remote --exit-code --heads origin badges >/dev/null 2>&1
          remote_state=$?
          set -e

          case "$remote_state" in
            0)
              git fetch --no-tags --quiet --depth=1 origin badges
              if git show FETCH_HEAD:mutation-highwater.json > "$mark.tmp" 2>/dev/null; then
                mv "$mark.tmp" "$mark"
                printf 'stored high-water mark: %s%%\n' "$(jq -r '.mark' "$mark")"
              else
                rm -f "$mark.tmp"
                mark=''
                echo 'badges branch carries no high-water mark yet'
              fi
              ;;
            2)
              mark=''
              echo 'no badges branch yet; the committed thresholds govern'
              ;;
            *)
              echo 'cannot reach origin to read the high-water mark; refusing to guess' >&2
              exit 1
              ;;
          esac

          # One invocation, both arms: `thresholds <cfg> ""` and
          # `thresholds <cfg>` are equivalent.
          flags=$(scripts/mutation-ratchet.sh thresholds src/stryker-config.json "$mark")
          printf 'gate flags: %s\n' "${flags:-<none, from stryker-config.json>}"
          echo "flags=$flags" >> "$GITHUB_OUTPUT"
          echo "mark=$mark" >> "$GITHUB_OUTPUT"

      # Deferred enforcement — see docs/mutation-testing.md. Must run before the
      # badge step, which switches the tree to the badges branch.
      - name: Mutation test
        id: mutation
        continue-on-error: true
        timeout-minutes: 20
        working-directory: src
        env:
          # Via env rather than ${{ }} interpolated into the script, so the
          # value cannot terminate the command it sits in.
          GATE_FLAGS: ${{ steps.gate.outputs.flags }}
        # $GATE_FLAGS is deliberately unquoted: it is a flag LIST that has to
        # word-split, and it is empty whenever there is no stored mark.
        run: dotnet stryker --output ../mutation $GATE_FLAGS

      - name: Publish mutation summary
        if: always()
        run: |
          if [ -f mutation/reports/mutation-report.md ]; then
            cat mutation/reports/mutation-report.md >> $GITHUB_STEP_SUMMARY
          else
            echo '### Mutation testing produced no report — see the step log' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: mutation/reports/
          retention-days: 30

      # Written to RUNNER_TEMP, not the work tree: the badge step below switches
      # to the badges branch, where scripts/ does not exist.
      #
      # The write is staged through a temp file and moved only on success.
      # Redirecting straight to the final path would create it before the
      # generator ran, so a refused report would leave a zero-byte file for the
      # badge step to publish — destroying a working badge. The badge step
      # validates the payload as well; both guards are cheap and it force-pushes.
      #
      # continue-on-error is required, not belt-and-braces: without it a failure
      # here would skip the badge, Pages and formatting steps below, which is
      # the trap documented on the Enforce step.
      - name: Build mutation badge payload
        if: always()
        continue-on-error: true
        run: |
          scripts/mutation-report.sh badge mutation/reports/mutation-report.json > "$RUNNER_TEMP/mutation.json.tmp"
          mv "$RUNNER_TEMP/mutation.json.tmp" "$RUNNER_TEMP/mutation.json"

      # Default-branch only, so an in-flight pull request cannot move the bar
      # for every other open one. Pull requests still READ the mark above and
      # are gated against it; they simply never reach this step.
      #
      # continue-on-error and always() for the same reason as the badge payload
      # step: "the score did not beat the mark" is the common case, not a
      # failure, and it must not skip the publish steps below. The script exits
      # 3 to say so. It refuses outright on a sweep with pending mutants —
      # recording a score from an interrupted run would raise the bar
      # permanently on a measurement that never happened.
      - name: Advance the high-water mark
        if: always() && github.ref == 'refs/heads/master'
        continue-on-error: true
        env:
          MARK: ${{ steps.gate.outputs.mark }}
        run: |
          out="$RUNNER_TEMP/highwater-new.json"
          scripts/mutation-ratchet.sh advance src/stryker-config.json \
            mutation/reports/mutation-report.json "$MARK" > "$out.tmp"
          mv "$out.tmp" "$out"
          printf 'raising the high-water mark to %s%%\n' "$(jq -r '.mark' "$out")"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/report/
          retention-days: 30

      # Assembles both reports into one artifact. Runs BEFORE the badge step,
      # and that order is load-bearing — see docs/mutation-testing.md, "Why it
      # runs before the badge step".
      #
      # What the order COSTS, which is not nothing: this step has a bare `if:`,
      # so it implies success(), and an assemble failure now skips the badge
      # publish below. The previous order carried the same coupling reversed —
      # a badge failure skipped the Pages steps. Reordering moved the coupling
      # rather than removing it. This direction is preferred because assembling
      # is the cheaper and more deterministic of the two: failing before the
      # branch switch beats discovering it afterwards, on a branch where
      # scripts/ no longer exists.
      - name: Assemble Pages site
        if: github.ref == 'refs/heads/master'
        run: scripts/assemble-pages.sh coverage/report mutation/reports pages-site

      # Branch manipulation lives in a script so it can be tested against a
      # throwaway repo — see scripts/publish-badges.test.sh. It adds files to
      # the badges branch rather than rebuilding it, which is what keeps the
      # mutation badge and the ratchet's stored high-water mark alive.
      - name: Update quality badges
        if: github.ref == 'refs/heads/master'
        env:
          MUTATION_BADGE: ${{ runner.temp }}/mutation.json
          # Written only when the score actually beat the mark. When it did
          # not, the path simply does not exist, and publish-badges.sh treats
          # an absent payload as "leave the stored mark alone" — the same
          # semantics as the badge, so no extra conditional is needed here.
          HIGHWATER: ${{ runner.temp }}/highwater-new.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          scripts/publish-badges.sh coverage/report/badge_linecoverage.svg

      # This step's id feeds outputs.pages-artifact, which is what gates the
      # deploy-pages job. Renaming the step is fine; dropping the id is not.
      - name: Upload Pages artifact
        id: pages-upload
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages-site/

      # Deliberately the last step, and deliberately inside this job rather than a
      # job of its own: "Build & Test" is a required status check, so failing here is
      # what actually blocks a merge. Any non-zero Stryker exit counts — 2 is a
      # break-threshold violation, 1 is Stryker itself failing.
      - name: Enforce mutation score
        if: always() && steps.mutation.outcome == 'failure'
        run: |
          echo "::error::Mutation testing failed. See the job summary for the score, and the mutation-report artifact for surviving mutants."
          exit 1

  deploy-pages:
    name: Deploy quality reports to Pages
    runs-on: ubuntu-latest
    needs: build-and-test
    # !cancelled() rather than the implicit success(), so a failed mutation gate
    # still deploys the reports. Gated on the artifact actually existing, so an
    # earlier failure skips this cleanly instead of failing with no artifact.
    if: ${{ !cancelled() && github.ref == 'refs/heads/master' && needs.build-and-test.outputs.pages-artifact == 'true' }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # The browsable half of the schema documentation: an ER diagram and per-table pages,
  # generated by tbls against a throwaway database.
  #
  # ⭐ The output is an ARTEFACT, never a committed file. A committed human-readable copy is
  # exactly what drifted before (see docs/adr/0004-schema-documentation.md); an artefact cannot
  # go stale because it is rebuilt from the migrations on every run.
  #
  # ⛔ Separate from build-and-test because it needs a live PostgreSQL. The committed
  # docs/schema.sql needs none, so its drift gate stays in the build job and keeps working on
  # runners that hold no Docker daemon.
  #
  # ⚠️ Deliberately NOT a required check. It documents; it does not gate. `continue-on-error`
  # keeps a tbls or container hiccup from blocking a merge on a schema that is otherwise fine.
  database-docs:
    name: Schema diagram
    runs-on: ubuntu-latest
    needs: build-and-test
    continue-on-error: true

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: anichron
          POSTGRES_PASSWORD: anichron
          POSTGRES_DB: anichron_docs
        ports:
          - 5432:5432
        # Without a health check the migration step races the server's first startup and fails
        # with a connection error that reads like a broken connection string.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Apply migrations to a throwaway database
        # ⭐ Migrations rather than a hand-written schema: this also proves the migrations
        # actually APPLY, which building the model alone never checks.
        env:
          POSTGRES_CONNECTION__HOST: localhost
          POSTGRES_CONNECTION__DBNAME: anichron_docs
          POSTGRES_CONNECTION__USERNAME: anichron
          POSTGRES_CONNECTION__PASSWORD: anichron
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.12
          dotnet ef database update --project src/Anichron.Core \
            --connection "Host=localhost;Database=anichron_docs;Username=anichron;Password=anichron"

      - name: Generate the schema documentation
        run: |
          curl -sSL -o tbls.tar.gz \
            https://github.com/k1LoW/tbls/releases/download/v1.96.0/tbls_v1.96.0_linux_amd64.tar.gz
          tar -xzf tbls.tar.gz tbls
          ./tbls doc --rm-dist \
            "postgres://anichron:anichron@localhost:5432/anichron_docs?sslmode=disable" \
            schema-docs

      - name: Upload the schema documentation
        uses: actions/upload-artifact@v7
        with:
          name: schema-docs
          path: schema-docs/
          retention-days: 30

  docker:
    name: Docker — ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: API
            repo: anichron-api
            dockerfile: src/Anichron.API/Dockerfile
          - name: Worker
            repo: anichron-worker
            dockerfile: src/Anichron.Worker/Dockerfile

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.repo }}
          flavor: |
            latest=false
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=edge,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v7
        with:
          context: src
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') || inputs.push_to_registry == true }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.repo }}:edge
          cache-to: type=inline
          provenance: false
