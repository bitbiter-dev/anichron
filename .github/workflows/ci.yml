name: CI

on:
  push:
    branches: [master]
    tags: ['v*.*.*']
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      push_to_registry:
        description: Push images to Docker Hub
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      pages-artifact: ${{ steps.pages-upload.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build src/

      - name: Test
        run: dotnet test src/ --no-build --collect:"XPlat Code Coverage" --results-directory coverage --settings src/coverlet.runsettings

      - name: Generate coverage report
        uses: danielpalme/ReportGenerator-GitHub-Action@v5
        with:
          reports: 'coverage/**/coverage.cobertura.xml'
          targetdir: 'coverage/report'
          reporttypes: 'HtmlInline;MarkdownSummaryGithub;Badges'
          verbosity: 'Warning'

      - name: Publish coverage summary
        if: always()
        run: cat coverage/report/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

      - name: Check formatting
        run: dotnet format --verify-no-changes src/

      - name: Restore .NET tools
        run: dotnet tool restore

      # Deferred enforcement — see docs/mutation-testing.md. Must run before the
      # badge step, which switches the tree to the badges branch.
      - name: Mutation test
        id: mutation
        continue-on-error: true
        timeout-minutes: 20
        working-directory: src
        run: dotnet stryker --output ../mutation

      - name: Publish mutation summary
        if: always()
        run: |
          if [ -f mutation/reports/mutation-report.md ]; then
            cat mutation/reports/mutation-report.md >> $GITHUB_STEP_SUMMARY
          else
            echo '### Mutation testing produced no report — see the step log' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: mutation/reports/
          retention-days: 30

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/report/
          retention-days: 30

      - name: Update coverage badge
        if: github.ref == 'refs/heads/master'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin badges:badges 2>/dev/null || true
          git checkout badges 2>/dev/null || git checkout --orphan badges
          git rm -rf . --quiet 2>/dev/null || true
          cp coverage/report/badge_linecoverage.svg coverage.svg
          git add coverage.svg
          git diff --staged --quiet || git commit -m "chore: update coverage badge"
          git push --force origin badges

      - name: Prepare coverage report for Pages
        if: github.ref == 'refs/heads/master'
        run: touch coverage/report/.nojekyll

      - name: Upload coverage report to Pages
        id: pages-upload
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5
        with:
          path: coverage/report/

      # Deliberately the last step, and deliberately inside this job rather than a
      # job of its own: "Build & Test" is a required status check, so failing here is
      # what actually blocks a merge. Any non-zero Stryker exit counts — 2 is a
      # break-threshold violation, 1 is Stryker itself failing.
      - name: Enforce mutation score
        if: always() && steps.mutation.outcome == 'failure'
        run: |
          echo "::error::Mutation testing failed. See the job summary for the score, and the mutation-report artifact for surviving mutants."
          exit 1

  deploy-pages:
    name: Deploy coverage report to Pages
    runs-on: ubuntu-latest
    needs: build-and-test
    # !cancelled() rather than the implicit success(), so a failed mutation gate
    # still deploys the coverage report. Gated on the artifact actually existing,
    # so an earlier failure skips this cleanly instead of failing with no artifact.
    if: ${{ !cancelled() && github.ref == 'refs/heads/master' && needs.build-and-test.outputs.pages-artifact == 'true' }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  docker:
    name: Docker — ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: API
            repo: anichron-api
            dockerfile: src/Anichron.API/Dockerfile
          - name: Worker
            repo: anichron-worker
            dockerfile: src/Anichron.Worker/Dockerfile

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.repo }}
          flavor: |
            latest=false
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=edge,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v7
        with:
          context: src
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') || inputs.push_to_registry == true }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.repo }}:edge
          cache-to: type=inline
          provenance: false
