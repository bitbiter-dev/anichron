name: Architecture review due

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  count:
    name: Count PRs since the last architecture review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Open or update the review issue at 10 PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/arch-review-due.sh 10
