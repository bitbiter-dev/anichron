# The weekly full run: the full backend and UI sweeps, the divergence check,
# and the quality reports and badges. A failure opens an issue. See
# docs/mutation-testing.md, "The weekly full run".
name: Weekly full run

on:
  schedule:
    # 05:17 on Mondays. Off the hour on purpose — GitHub queues scheduled jobs
    # at popular times, and a run that starts twenty minutes late is a run whose
    # two sweeps are further apart than they need to be.
    - cron: '17 5 * * 1'
  workflow_dispatch:

concurrency:
  group: weekly-full-run
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  targets:
    name: Mutation targets
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.plan.outputs.projects }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Plan every target
        id: plan
        run: |
          set -o pipefail
          projects=$(scripts/mutation-changed.sh --matrix --all | jq -c '.projects')
          if [ "$(jq length <<<"$projects")" -eq 0 ]; then
            echo "::error::scripts/mutation-targets.sh listed no projects; nothing would be mutated"
            exit 1
          fi
          echo "projects=$projects" >> "$GITHUB_OUTPUT"

  mutation-project:
    name: Backend — ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: targets
    # Both sweeps on one runner; step limits below the job's keep the summary.
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.projects) }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/lfs

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore .NET tools
        run: dotnet tool restore

      # CLAUDE.md forbids passing score-affecting flags to Stryker, because the
      # config file is what keeps a local run and the CI run comparable. This
      # job is the one deliberate exception: --concurrency is the variable under
      # test, so it is the one flag that must be passed here and nowhere else.
      #
      # continue-on-error on both sweeps: a sweep that scores below the break
      # threshold exits 2, and that is not what the comparison is asking about.
      # The comparison step decides the divergence, and it fails the job on a
      # missing report rather than letting a crashed sweep pass silently.
      - name: Sweep at CI concurrency
        id: default
        continue-on-error: true
        timeout-minutes: 30
        env:
          ARGS: ${{ toJSON(matrix.args) }}
        run: |
          mapfile -t args < <(jq -r '.[]' <<<"$ARGS")
          scripts/stryker-sweep.sh "${args[@]}" --output ../mutation-default

      - name: Sweep single-threaded
        continue-on-error: true
        timeout-minutes: 60
        env:
          ARGS: ${{ toJSON(matrix.args) }}
        run: |
          mapfile -t args < <(jq -r '.[]' <<<"$ARGS")
          scripts/stryker-sweep.sh "${args[@]}" --concurrency 1 --output ../mutation-single

      - name: Upload both reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-divergence-${{ matrix.name }}
          path: |
            mutation-default/reports/
            mutation-single/reports/
          retention-days: 30

      # The summary is written BEFORE the comparison so the numbers are there
      # whichever way the comparison goes — on a divergence this is the whole
      # diagnosis, and needing to download two artifacts to see four integers is
      # how a red scheduled job gets ignored.
      - name: Summarise both sweeps
        if: always()
        env:
          NAME: ${{ matrix.name }}
        run: |
          d=mutation-default/reports/mutation-report.json
          s=mutation-single/reports/mutation-report.json

          # Emits one table row, or a row saying why there isn't one, and
          # returns non-zero in the second case.
          #
          # It tests whether the report is USABLE, not merely present, and that
          # distinction is the whole point. A sweep that was interrupted leaves
          # a JSON file full of Pending mutants: the file exists, so a `[ -f ]`
          # check passes, but `tally` refuses it because any score computed from
          # it reads better than reality. An earlier revision piped tally
          # straight into jq -- and since a pipeline's status is the LAST
          # command's, and `run:` blocks are bash -e without pipefail, the
          # failure was swallowed, jq printed nothing, and the summary rendered
          # a table with a missing row under the words "the measurement is
          # sound". That is precisely the case tally's guard exists to catch.
          row() {
            local label="$1" report="$2" tally
            if [ ! -f "$report" ]; then
              printf '| %s | — | — | **no report** |\n' "$label"
              return 1
            fi
            if ! tally=$(scripts/mutation-report.sh tally "$report" 2>&1); then
              printf '| %s | — | — | **unusable** |\n' "$label"
              printf '\n> `%s`: %s\n\n' "$label" "$(printf '%s' "$tally" | head -1)"
              return 1
            fi
            printf '%s' "$tally" \
              | jq -r --arg l "$label" '"| \($l) | \(.detected) | \(.total) | \(.score)% |"'
          }

          {
            echo "## Mutation divergence check: $NAME"
            echo
            echo '| sweep | detected | detectable | score |'
            echo '|---|---:|---:|---:|'
            both_usable=true
            row 'CI concurrency'  "$d" || both_usable=false
            row 'single-threaded' "$s" || both_usable=false
            echo
            if [ "$both_usable" = true ]; then
              echo 'Equal **detected** counts mean the measurement is sound. A difference means'
              echo 'the score the pull-request gate has been enforcing is not measuring what we'
              echo 'think it is — see `docs/mutation-testing.md`.'
            else
              echo 'At least one sweep produced no usable report, so **there is nothing to'
              echo 'compare** — this is a failed sweep, not a divergence. Check the step logs'
              echo 'and the uploaded artifacts.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # The committed script, not an inline comparison: the "did this run even
      # finish" guards live in it, and a pending-mutant report would otherwise
      # compare two numbers that both read better than reality.
      # always(), not a bare `if:`. A bare one implies success(), so a failure in
      # the summary step above -- which runs under always() and therefore can
      # fail after an earlier step already has -- would SKIP this step, and the
      # job would fail on formatting rather than on the measurement. This step
      # is the one that decides the outcome, so it has to run.
      - name: Compare detected counts
        if: always()
        run: |
          scripts/mutation-report.sh compare \
            mutation-default/reports/mutation-report.json \
            mutation-single/reports/mutation-report.json

      - name: Publish mutation summary
        if: always()
        run: |
          if [ -f mutation-default/reports/mutation-report.md ]; then
            cat mutation-default/reports/mutation-report.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload project report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-part-${{ matrix.name }}
          path: mutation-default/reports/mutation-report.json
          if-no-files-found: ignore
          retention-days: 1

      - name: Enforce mutation score
        if: always()
        env:
          OUTCOME: ${{ steps.default.outcome }}
        run: |
          if [ "$OUTCOME" != success ]; then
            echo "::error::The sweep at CI concurrency failed or scored below its thresholds ($OUTCOME). Its summary and the mutation-divergence-${{ matrix.name }} artifact list the survivors."
            exit 1
          fi

  mutation:
    name: Backend report
    runs-on: ubuntu-latest
    needs: [targets, mutation-project]
    if: ${{ !cancelled() }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: mutation-part-*
          path: parts

      - name: Merge project reports
        id: merge
        continue-on-error: true
        env:
          PROJECTS: ${{ needs.targets.outputs.projects }}
        run: scripts/mutation-merge-parts.sh "$PROJECTS" parts mutation/reports

      - name: Publish merged score
        if: steps.merge.outcome == 'success'
        run: |
          scripts/mutation-report.sh tally mutation/reports/mutation-report.json \
            | jq -r '"### Mutation score, all projects: \(.score)% (\(.detected) of \(.total) detected)"' >> $GITHUB_STEP_SUMMARY

      - name: Upload mutation report
        if: steps.merge.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: mutation/reports/
          retention-days: 30

      # Staged through a temp file: a refused report must leave no payload.
      - name: Build mutation badge payload
        if: steps.merge.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p mutation-state
          scripts/mutation-report.sh badge mutation/reports/mutation-report.json > mutation-state/mutation.json.tmp
          mv mutation-state/mutation.json.tmp mutation-state/mutation.json

      - name: Upload badge state
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-state
          path: mutation-state/*.json
          if-no-files-found: ignore
          retention-days: 1

      - name: Enforce every project
        if: always()
        env:
          TARGETS: ${{ needs.targets.result }}
          PROJECTS: ${{ needs.mutation-project.result }}
          MERGE: ${{ steps.merge.outcome }}
        run: |
          if [ "$TARGETS" != success ] || [ "$PROJECTS" != success ] || [ "$MERGE" != success ]; then
            echo "::error::The backend full run failed (targets: $TARGETS, projects: $PROJECTS, merge: $MERGE). Each project job's summary has its score and divergence check."
            exit 1
          fi

  ui:
    name: UI sweep
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          working-directory: src/Anichron.UI
          require-lockfile: true
          cache: true

      - name: Mutation test
        run: scripts/ui-mutation-changed.sh --all

      - name: Publish the incremental baseline
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: ui-mutation-incremental
          path: src/Anichron.UI/reports/stryker-incremental.json
          if-no-files-found: error
          retention-days: 30

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/lfs

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test src/ -p:TestSuite=Unit --collect:"XPlat Code Coverage" --results-directory coverage --settings src/coverlet.runsettings

      - name: Generate coverage report
        uses: danielpalme/ReportGenerator-GitHub-Action@v5
        with:
          reports: 'coverage/**/coverage.cobertura.xml'
          targetdir: 'coverage/report'
          reporttypes: 'HtmlInline;MarkdownSummaryGithub;Badges'
          verbosity: 'Warning'

      - name: Publish coverage summary
        if: always()
        run: cat coverage/report/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/report/
          retention-days: 30

  # Not gated on the mutation result, so a failed sweep still publishes its
  # report — see docs/mutation-testing.md.
  publish:
    name: Publish quality reports
    runs-on: ubuntu-latest
    needs: [coverage, mutation]
    if: ${{ !cancelled() && github.ref == 'refs/heads/master' && needs.coverage.result == 'success' }}
    permissions:
      contents: write
    outputs:
      pages-artifact: ${{ steps.pages-upload.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: coverage-report
          path: coverage/report

      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: mutation-report
          path: mutation/reports

      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: mutation-state
          path: ${{ runner.temp }}/mutation-state

      # Before the badge step, which switches the tree to the badges branch,
      # where scripts/ does not exist. See docs/mutation-testing.md, "Why it
      # runs before the badge step".
      - name: Assemble Pages site
        run: scripts/assemble-pages.sh coverage/report mutation/reports pages-site

      - name: Update quality badges
        env:
          MUTATION_BADGE: ${{ runner.temp }}/mutation-state/mutation.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          scripts/publish-badges.sh coverage/report/badge_linecoverage.svg

      # Its id feeds outputs.pages-artifact, which gates deploy-pages.
      - name: Upload Pages artifact
        id: pages-upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages-site/

  deploy-pages:
    name: Deploy quality reports to Pages
    runs-on: ubuntu-latest
    needs: publish
    if: ${{ !cancelled() && github.ref == 'refs/heads/master' && needs.publish.outputs.pages-artifact == 'true' }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  report:
    name: Report the outcome
    runs-on: ubuntu-latest
    needs: [mutation, ui, coverage, publish, deploy-pages]
    if: ${{ !cancelled() && github.ref == 'refs/heads/master' }}
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - name: Open, update or close the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          OWNER: ${{ github.repository_owner }}
        run: scripts/full-run-report.sh 'Weekly full run' "$RUN_ID" "$OWNER"
